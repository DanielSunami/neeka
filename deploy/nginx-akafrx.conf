server {
	listen 80;
	server_name akafrx.com;

	location ^~ /.well-known/acme-challenge/ {
		root /root/www;
		default_type text/plain;
		allow all;
	}

	location / {
		return 301 https://akafrx.com$request_uri;
	}
}

server {
	listen 443 ssl;
	server_tokens off;
	server_name akafrx.com;

	ssl_protocols TLSv1.2;
	ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256';
	ssl_prefer_server_ciphers On;
	ssl_certificate /etc/certs/akafrx.com/fullchain.pem;
	ssl_certificate_key /etc/certs/akafrx.com/key.pem;
	ssl_trusted_certificate /etc/certs/akafrx.com/fullchain.pem;
	ssl_session_cache shared:SSL:128m;
	ssl_stapling off;
	ssl_stapling_verify off;

	add_header Strict-Transport-Security "max-age=31557600; includeSubDomains";
	add_header X-Content-Type-Options "nosniff";
	add_header X-Frame-Options "SAMEORIGIN";
	add_header X-Xss-Protection "1";
	add_header Referrer-Policy origin-when-cross-origin;

	resolver 1.1.1.1;

	gzip on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_min_length 256;
	gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon text/js application/javascript;

	charset UTF-8;
	client_max_body_size 20m;

	location ^~ /.well-known/acme-challenge/ {
		root /root/www;
		default_type text/plain;
		allow all;
	}

	location / {
		proxy_pass http://127.0.0.1:8081;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
	}

	location ~ /\. {
		deny all;
		access_log off;
		log_not_found off;
		return 404;
	}
}
